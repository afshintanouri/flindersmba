# GitHub Pages deployment (project site: /flindersmba).
#
# Currently MANUAL ONLY: run from the Actions tab ("Deploy to GitHub Pages"),
# choose the branch, and type "deploy" to confirm.
#
# Automatic deployment from main is intentionally disabled until approved.
# To enable it later, uncomment the `push` trigger below.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to publish this branch to GitHub Pages'
        required: true
  # push:
  #   branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  NEXT_PUBLIC_BASE_PATH: /flindersmba
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  build:
    if: github.event_name == 'push' || github.event.inputs.confirm == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the unit tests check that the approved visual-baseline
          # commit (tests/visual-baseline.json) exists in this repository.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4 # version read from package.json "packageManager" (pnpm@12.3.4)

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generated OSCA and career data match the reviewed release
        run: pnpm verify:generated-data

      - name: Unit tests
        run: pnpm test:unit

      - name: Build static export (also validates content)
        run: pnpm build

      - name: Verify export
        run: |
          test -f out/.nojekyll
          grep -q '/flindersmba/_next/' out/index.html

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Smoke tests (gate before publishing)
        run: pnpm test:smoke

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
